[project]
name = "michael"
version = "0.1.0"
description = "Evidence-locked research agent for Obsidian: every sentence is tied to an exact source quote and checked by an independent NLI model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.5",
    "rapidfuzz>=3.9",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
michael = "michael.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = ["eval: re-scores the labelled sets with the real verifier (run with: pytest -m eval)"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 120
